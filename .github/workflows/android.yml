# Compile et teste l'app à chaque push. Sur un tag v* (ex. v1.2.0) : APK signé publié dans une Release GitHub.
name: Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Test de la fusion entre téléphones (JavaScript)
        run: node app/src/test/js/merge.test.js
      - name: Tests et APK de contrôle (non signé, mêmes vérifications que la release)
        run: ./gradlew --no-daemon test assembleRelease -PversionCode=${{ github.run_number }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # pour créer la Release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - name: APK signé
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secrets de signature absents (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Voir README."
            exit 1
          fi
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          ./gradlew --no-daemon test assembleRelease \
            -PversionCode=${{ github.run_number }} -PversionName="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "MoneyTracker-$GITHUB_REF_NAME.apk"
          rm -f "$KEYSTORE_FILE"

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Si la release existe déjà (créée à la main sur GitHub), on y attache seulement l'APK.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "MoneyTracker-$GITHUB_REF_NAME.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "MoneyTracker-$GITHUB_REF_NAME.apk" \
              --title "MoneyTracker $GITHUB_REF_NAME" \
              --notes "Télécharge l'APK ci-dessous depuis le téléphone et installe-le par-dessus l'app existante : tes données sont conservées."
          fi
